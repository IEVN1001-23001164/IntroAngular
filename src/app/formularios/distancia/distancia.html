<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div class="container">
        <div class="row">
            <div class="col-6">
                <form>
                    <div class="form-group pt-4">
                        <label for="x1">x1:</label>
                        <input [(ngModel)]="x1" name="x1" type="text" class="form-control"
                        id="x1" placeholder="Ingresa"/>
                    </div>

                    <div class="form-group pt-4">
                        <label for="y1">y1:</label>
                        <input [(ngModel)]="y1" name="y1" type="text" class="form-control"
                        id="y1" placeholder="Ingresa"/>
                    </div>

                    <div class="form-group pt-4">
                        <label for="x2">x2:</label>
                        <input [(ngModel)]="x2" name="x2" type="text" class="form-control"
                        id="x2" placeholder="Ingresa"/>
                    </div>

                    <div class="form-group pt-4">
                        <label for="y2">y2:</label>
                        <input [(ngModel)]="y2" name="y2" type="text" class="form-control"
                        id="y2" placeholder="Ingresa"/>
                    </div>
                    <br/>

                    <button (click)="calcular()" type="button" class="btn btn-primary">
                        Calcular distancia
                    </button>
                </form>
            </div>
            <div class="col-6">
                <h2>Distancia: {{resultado}}</h2>
            </div>
        </div>
    </div>

</body>
</html>
