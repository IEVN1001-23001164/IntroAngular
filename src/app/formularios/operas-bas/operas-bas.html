<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <form>

                    <div class="form-group pt-4">
                        <label for="num1">Numero 1:</label>
                        <input [(ngModel)]="num1" name="num1" type="text" class="form-control"
                        id="num1" placeholder="Ingresa numero 1"/>
                    </div>

                    <div class="form-group pt-4">
                        <label for="num2">Numero 2:</label>
                        <input [(ngModel)]="num2" name="num2" type="text" class="form-control"
                        id="num2" placeholder="Ingresa numero 2"/>
                    </div>

                    <br/>

                    <label>Selecciona una operación:</label>
                    <br/>

                    <input type="radio" name="operacion" value="suma" [(ngModel)]="operacion">
                    <label>Suma +</label>
                    <br/>

                    <input type="radio" name="operacion" value="resta" [(ngModel)]="operacion">
                    <label>Resta -</label>
                    <br/>

                    <input type="radio" name="operacion" value="multiplicacion" [(ngModel)]="operacion">
                    <label>Multiplicación *</label>
                    <br/>

                    <input type="radio" name="operacion" value="division" [(ngModel)]="operacion">
                    <label>División /</label>
                    <br/><br/>

                    <button (click)="calcular()" type="button" class="btn btn-primary">
                        Calcular
                    </button>
                   
                </form>
            </div>

            <div class="col-6">          
            </div>
            <h2>Resultado: {{resultado}} </h2>
        </div>
    </div>
</body>
</html>
