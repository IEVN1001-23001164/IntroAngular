<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">

            <div class="col-6">

                <h2>INICIO DE SESIÓN</h2>

                <form>

                    <div class="form-group pt-4">
                        <label for="usuario">Usuario:</label>
                        <input [(ngModel)]="usuario" name="usuario" type="text" class="form-control"
                        id="usuario" placeholder="Ingresa usuario"/>
                    </div>

                    <div class="form-group pt-4">
                        <label for="contrasena">Contraseña:</label>
                        <input [(ngModel)]="contrasena" name="contrasena" type="password" class="form-control"
                        id="contrasena" placeholder="Ingresa contraseña"/>
                    </div>

                    <br/>

                    <button (click)="validar()" type="button" class="btn btn-primary">
                        Iniciar sesión
                    </button>

                </form>

            </div>

            <div class="col-6">

                <h3>{{resultado}}</h3>

            </div>

        </div>
    </div>

</body>
</html>
